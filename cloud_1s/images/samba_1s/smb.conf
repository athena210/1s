[global]
    workgroup = WORKGROUP
    netbios name = SAMBA-1S
    server string = "File server"
    ntlm auth = yes
    min protocol = NT1

    load printers = no
    printcap name = /dev/null
    disable spoolss = yes
    winbind offline logon = yes
    server smb encrypt = desired

    hide dot files = no
    veto files = /lost+found/
    create mask = 0644
    force create mode = 0644
    directory mask = 0755
    force directory mode = 0755
    map archive = no
    map readonly = no


[db1]
    path = /srv/1sdb1
    valid users = samba_admin
    force user = user1s
    read only = yes


[1c]
    path = /srv/1sadmin
    valid users = samba_admin samba_user
    force user = user1s
    read only = no


[daily]
    path = /srv/1sdaily
    valid users = samba_admin
    force user = user1s
    read only = no


[monthly]
    path = /srv/1smonthly
    valid users = samba_admin
    force user = user1s
    read only = no
