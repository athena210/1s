[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
user=root


[unix_http_server]
file = /run/supervisord.sock

[supervisorctl]
serverurl=unix:///run/supervisord.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface


[group:group1]
programs=traefik,dnsmasq


[program:traefik]
command=traefik --configFile=/traefik.yml
autorestart=true
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0

[program:dnsmasq]
command=dnsmasq --conf-file=/etc/dnsmasq/dnsmasq.conf -d --log-queries=extra
autorestart=true
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
