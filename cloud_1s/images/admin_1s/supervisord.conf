[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
user=root


[unix_http_server]
file = /run/supervisord.sock

[supervisorctl]
serverurl=unix:///run/supervisord.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface


[group:group1]
#programs=gui,samba
programs=gui


[program:gui]
command=vncserver -localhost no -depth 24 -geometry 1366x768 -rfbport 5900 -cleanstale -useold -autokill -clean -fg -RawKeyboard=1
user=user1s
environment=HOME="/home/user1s",USER="user1s",SHELL="/bin/bash"
autorestart=true
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
